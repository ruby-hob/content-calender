<title>HOB 콘텐츠 캘린더</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --paper:#FBF8F3;
    --surface:#FFFFFF;
    --surface-2:#F3EEE5;
    --ink:#1B1720;
    --ink-soft:#645D6E;
    --ink-faint:#9A93A0;
    --line:#E6DFD3;
    --line-soft:#EFE9DD;
    --accent:#B85C86;
    --accent-contrast:#FFFFFF;
    --tag-cyan:#0E9C95;
    --tag-magenta:#C81361;
    --tag-amber:#A8650A;
    --tag-violet:#6657D6;
    --tag-lime:#5C7A0E;
    --tag-rust:#B5501C;
    --tag-teal:#1C7A8C;
    --tag-slate:#545B75;
    --status-done:#1E9E6B;
    --status-scheduled:#2F6FE4;
    --status-late:#D93A3A;
    --shadow-card:0 1px 2px rgba(27,23,32,.06), 0 8px 20px -12px rgba(27,23,32,.18);
    --shadow-pop:0 20px 60px -20px rgba(27,23,32,.45);
    --radius-card:18px;
    --radius-pill:999px;
    --radius-sm:10px;
    --font-display:'Unbounded', system-ui, sans-serif;
    --font-body:'Manrope', system-ui, -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#131019;
      --surface:#1C1824;
      --surface-2:#241F2E;
      --ink:#F4F0E9;
      --ink-soft:#B7AFC3;
      --ink-faint:#7C7488;
      --line:#302A3B;
      --line-soft:#241F2E;
      --accent:#F0A8C6;
      --accent-contrast:#2A0F1D;
      --tag-cyan:#00E6D8;
      --tag-magenta:#FF4FA0;
      --tag-amber:#FFC24B;
      --tag-violet:#A99BFF;
      --tag-lime:#B8E23D;
      --tag-rust:#FF8B5C;
      --tag-teal:#4FD6EC;
      --tag-slate:#A9B3D6;
      --status-done:#3DDC97;
      --status-scheduled:#5B9BFF;
      --status-late:#FF5C5C;
      --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
      --shadow-pop:0 20px 60px -20px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --paper:#131019;
    --surface:#1C1824;
    --surface-2:#241F2E;
    --ink:#F4F0E9;
    --ink-soft:#B7AFC3;
    --ink-faint:#7C7488;
    --line:#302A3B;
    --line-soft:#241F2E;
    --accent:#F0A8C6;
    --accent-contrast:#2A0F1D;
    --tag-cyan:#00E6D8;
    --tag-magenta:#FF4FA0;
    --tag-amber:#FFC24B;
    --tag-violet:#A99BFF;
    --tag-lime:#B8E23D;
    --tag-rust:#FF8B5C;
    --tag-teal:#4FD6EC;
    --tag-slate:#A9B3D6;
    --status-done:#3DDC97;
    --status-scheduled:#5B9BFF;
    --status-late:#FF5C5C;
    --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    --shadow-pop:0 20px 60px -20px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important; scroll-behavior:auto !important;}
  }
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--accent); color:var(--accent-contrast);}

  .wrap{max-width:1360px; margin:0 auto; padding:0 20px 120px;}

  /* ---- top bar ---- */
  .topbar{
    position:sticky; top:0; z-index:30;
    background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:16px 0 0;
  }
  .topbar-inner{max-width:1360px; margin:0 auto; padding:0 20px 12px; display:flex; flex-direction:column; gap:12px;}
  .brand-row{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .wordmark .mark{
    font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:-.01em; color:var(--ink);
  }
  .nav-cluster{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .seg{display:flex; border:1px solid var(--line); border-radius:var(--radius-pill); padding:3px; background:var(--surface);}
  .seg-btn{
    border:0; background:transparent; color:var(--ink-soft); font-size:12.5px; font-weight:700;
    padding:6px 14px; border-radius:var(--radius-pill); cursor:pointer; transition:background .12s ease, color .12s ease;
  }
  .seg-btn.active{background:var(--ink); color:var(--paper);}
  .date-nav{display:flex; align-items:center; gap:4px; font-family:var(--font-mono);}
  .nav-arrow{
    width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:var(--surface);
    color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .nav-arrow:hover{color:var(--ink); border-color:var(--ink-faint);}
  .range-label{font-size:13.5px; font-weight:600; min-width:112px; text-align:center; color:var(--ink);}

  .actions-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .search{
    flex:1 1 220px; min-width:160px; display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-pill);
    padding:9px 14px;
  }
  .search svg{flex:none; opacity:.55;}
  .search input{
    border:0; outline:0; background:transparent; color:var(--ink); font-size:14px; width:100%;
    font-family:var(--font-body);
  }
  .search input::placeholder{color:var(--ink-faint);}
  .btn{
    border:0; cursor:pointer; font-weight:700; border-radius:var(--radius-pill);
    padding:10px 18px; font-size:14px; display:inline-flex; align-items:center; gap:8px;
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{
    background:var(--accent); color:var(--accent-contrast);
    box-shadow:0 6px 16px -8px color-mix(in srgb, var(--accent) 55%, transparent);
  }
  .btn-primary:hover{box-shadow:0 8px 20px -6px color-mix(in srgb, var(--accent) 60%, transparent);}
  .btn-ghost{
    background:var(--surface); color:var(--ink); border:1px solid var(--line);
  }
  .btn-ghost:hover{border-color:var(--ink-faint);}
  .btn-text{background:transparent; color:var(--ink-soft); padding:8px 4px; border:0; cursor:pointer; font-weight:700; font-size:12.5px; display:inline-flex; align-items:center; gap:5px;}
  .btn-text:hover{color:var(--ink);}
  .btn[disabled]{opacity:.45; cursor:not-allowed;}

  .chips-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .chips{display:flex; gap:8px; flex-wrap:wrap; overflow-x:auto; padding-bottom:2px; flex:1;}
  .chip{
    flex:none; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    border-radius:var(--radius-pill); padding:7px 13px; font-size:12.5px; font-weight:600;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:all .12s ease;
  }
  .chip .dot{width:7px; height:7px; border-radius:50%; background:currentColor;}
  .chip.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .chip:hover:not(.active){border-color:var(--ink-faint); color:var(--ink);}

  /* ---- banner ---- */
  .banner{
    margin:16px 0 0; padding:12px 16px; border-radius:var(--radius-sm);
    background:var(--surface-2); border:1px solid var(--line); font-size:13px; color:var(--ink-soft);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }

  /* ---- month view ---- */
  .month-wrap{margin-top:22px;}
  .month-dow{display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-bottom:8px;}
  .month-dow span{font-size:11.5px; font-weight:700; color:var(--ink-faint); text-align:center;}
  .month-cells{display:grid; grid-template-columns:repeat(7,1fr); gap:10px; align-items:stretch;}
  .day-cell{
    background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:7px;
    display:flex; flex-direction:column; gap:5px; cursor:pointer; transition:border-color .12s ease;
    min-height:0; min-width:0; overflow:hidden; align-self:start;
  }
  .day-cell:hover{border-color:var(--ink-faint);}
  .day-cell.outside{opacity:.4;}
  .day-num{font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--ink-soft); display:flex; align-items:center; gap:5px; flex:none; min-width:0;}
  .day-num:hover{color:var(--ink);}
  .day-memo{
    font-family:var(--font-body); font-size:10px; font-weight:700; color:var(--accent);
    background:color-mix(in srgb, var(--accent) 14%, transparent); padding:1px 6px; border-radius:999px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1 1 auto;
  }
  .day-cell.today .day-num .today-badge{
    background:var(--accent); color:var(--accent-contrast); width:20px; height:20px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-weight:700;
  }
  .day-slot{display:flex; flex-direction:column; gap:4px; min-height:0; min-width:0;}
  .day-thumb{
    width:100%; aspect-ratio:1/1; border-radius:8px; overflow:hidden; background:var(--surface-2);
    display:grid; grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(2,1fr); gap:2px;
    min-height:0; min-width:0; flex:none;
  }
  .day-thumb-tile{position:relative; width:100%; height:100%; overflow:hidden; cursor:pointer; min-height:0; min-width:0;}
  .day-thumb-tile img{width:100%; height:100%; object-fit:cover; display:block;}
  .day-thumb-tile .view-tab, .day-thumb-tile .edit-tab{
    position:absolute; bottom:3px; z-index:2; font-size:9.5px; font-weight:800; letter-spacing:-.01em;
    padding:3px 7px; border-radius:999px; color:var(--accent-contrast);
    line-height:1; box-shadow:0 1px 4px rgba(0,0,0,.35); cursor:pointer; white-space:nowrap;
  }
  .day-thumb-tile .view-tab:hover, .day-thumb-tile .edit-tab:hover{filter:brightness(1.08);}
  .day-thumb-tile .view-tab{left:3px; background:var(--accent);}
  .day-thumb-tile .edit-tab{right:3px; background:var(--ink);}
  .day-thumb.empty{display:flex; align-items:center; justify-content:center; border:1.5px dashed var(--line); background:transparent; color:var(--ink-faint);}
  .day-thumb.empty svg{opacity:.35; transition:opacity .12s ease;}
  .day-cell:hover .day-thumb.empty svg{opacity:.75;}
  .day-title{font-size:11px; font-weight:700; color:var(--ink); line-height:1.35; white-space:normal; overflow-wrap:break-word;}
  .day-more{font-size:10.5px; font-weight:700; color:var(--ink-faint); height:14px; line-height:14px; flex:none; overflow:hidden; white-space:nowrap;}
  .day-more:not(:empty){cursor:pointer;}
  .day-more:not(:empty):hover{color:var(--ink);}

  /* ---- week view ---- */
  .week{margin-top:22px;}
  .week-head{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:14px;}
  .week-title-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .week-range{font-family:var(--font-display); font-weight:700; font-size:17px;}
  .pill-now{
    font-family:var(--font-mono); font-size:10.5px; font-weight:600; letter-spacing:.04em;
    color:var(--accent-contrast); background:var(--accent);
    border-radius:var(--radius-pill); padding:3px 9px;
  }
  .week-progress{display:flex; align-items:center; gap:8px;}
  .progress-track{width:96px; height:6px; border-radius:var(--radius-pill); background:var(--surface-2); overflow:hidden; border:1px solid var(--line);}
  .progress-fill{height:100%; background:var(--accent); border-radius:var(--radius-pill);}
  .progress-label{font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); white-space:nowrap;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(188px, 1fr)); gap:16px;}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-card);
    box-shadow:var(--shadow-card); cursor:pointer; overflow:hidden;
    display:flex; flex-direction:column; transition:transform .14s ease, box-shadow .14s ease;
  }
  .card:hover{transform:translateY(-3px); box-shadow:0 4px 8px rgba(0,0,0,.06), 0 16px 30px -14px rgba(0,0,0,.28);}
  .thumb{
    position:relative; width:100%; aspect-ratio:9/16; background:var(--surface-2);
    overflow:hidden; flex:none;
  }
  .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb-ph{width:100%; height:100%; display:flex; align-items:center; justify-content:center;}
  .type-badge{
    position:absolute; top:8px; left:8px; z-index:2;
    font-size:11px; font-weight:700; padding:4px 9px; border-radius:var(--radius-pill);
    background:color-mix(in srgb, var(--ink) 78%, transparent); color:var(--paper);
    display:flex; align-items:center; gap:5px; max-width:calc(100% - 40px);
  }
  .type-badge .dot{width:6px; height:6px; border-radius:50%; flex:none;}
  .type-badge span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .del-btn{
    position:absolute; top:8px; right:8px; z-index:2; width:26px; height:26px; border-radius:50%;
    background:color-mix(in srgb, var(--ink) 78%, transparent); color:var(--paper); border:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .12s ease, background .12s ease, width .12s ease;
  }
  .card:hover .del-btn, .del-btn.confirming{opacity:1;}
  .del-btn.confirming{background:var(--status-late); width:auto; padding:0 10px; font-size:11px; font-weight:700; gap:5px; font-family:var(--font-body);}

  .card-body{padding:11px 12px 12px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .meta-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .card-date{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1 1 auto;}
  .card-memo{color:var(--accent); font-weight:700;}
  .status{display:flex; align-items:center; gap:5px; font-size:11px; font-weight:700; flex:none;}
  .status .dot{width:6px; height:6px; border-radius:50%;}
  .card-title{
    font-weight:700; font-size:14px; line-height:1.35; margin:0;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card-desc{
    font-size:12.5px; color:var(--ink-soft); line-height:1.45; margin:0;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:17px;
  }
  .card-foot{display:flex; gap:6px; margin-top:auto; padding-top:8px; border-top:1px solid var(--line-soft);}
  .link-chip{
    flex:1; text-align:center; font-size:11.5px; font-weight:700; padding:7px 6px; border-radius:var(--radius-sm);
    background:var(--surface-2); color:var(--ink-soft); text-decoration:none; display:flex; align-items:center; justify-content:center; gap:5px;
    border:1px solid transparent; overflow:hidden; white-space:nowrap;
  }
  .link-chip.live{color:var(--ink); border-color:var(--line);}
  .link-chip.live:hover{border-color:var(--ink-faint);}
  .link-chip.empty{cursor:default; opacity:.5;}
  .example-tag{
    position:absolute; bottom:8px; left:8px; z-index:2; font-size:10px; font-weight:700;
    background:color-mix(in srgb, var(--paper) 85%, transparent); color:var(--ink-soft);
    padding:2px 7px; border-radius:var(--radius-pill); border:1px solid var(--line);
  }

  /* ---- empty state ---- */
  .empty{
    margin-top:60px; display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center;
    color:var(--ink-soft); padding:40px 20px;
  }
  .empty h2{font-family:var(--font-display); font-size:19px; color:var(--ink); margin:0; font-weight:700;}
  .empty p{margin:0; font-size:13.5px; max-width:360px;}

  /* ---- fab ---- */
  .fab{
    position:fixed; right:20px; bottom:22px; z-index:25; width:54px; height:54px; border-radius:50%;
    background:var(--accent); color:var(--accent-contrast); border:0; cursor:pointer;
    box-shadow:0 10px 24px -8px color-mix(in srgb, var(--accent) 55%, transparent);
    display:flex; align-items:center; justify-content:center; transition:transform .12s ease;
  }
  .fab:active{transform:scale(.94);}

  /* ---- lightbox ---- */
  .lightbox-overlay{
    position:fixed; inset:0; z-index:70; background:color-mix(in srgb, #000 78%, transparent);
    display:flex; align-items:center; justify-content:center; padding:5vh 20px; cursor:zoom-out;
  }
  .lightbox-overlay img{max-width:min(90vw, 520px); max-height:90vh; object-fit:contain; border-radius:12px; box-shadow:var(--shadow-pop);}
  .lightbox-close{
    position:fixed; top:18px; right:20px; z-index:71; background:color-mix(in srgb, #000 45%, transparent);
    color:#fff; border-radius:50%; width:36px; height:36px; align-items:center; justify-content:center;
  }
  .lightbox-close:hover{background:color-mix(in srgb, #000 65%, transparent); color:#fff;}

  /* ---- modal ---- */
  .overlay{
    position:fixed; inset:0; z-index:50; background:color-mix(in srgb, #000 55%, transparent);
    backdrop-filter:blur(3px); display:flex; align-items:flex-start; justify-content:center;
    padding:5vh 16px; overflow-y:auto;
  }
  .modal{
    background:var(--surface); border:1px solid var(--line); border-radius:20px; width:100%; max-width:600px;
    box-shadow:var(--shadow-pop); overflow:hidden;
  }
  .modal.narrow{max-width:440px;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--line);}
  .modal-head h3{margin:0; font-family:var(--font-display); font-size:16px; font-weight:700;}
  .icon-btn{background:transparent; border:0; cursor:pointer; color:var(--ink-soft); padding:4px; display:flex; border-radius:8px;}
  .icon-btn:hover{color:var(--ink); background:var(--surface-2);}
  .modal-body{padding:20px; display:flex; flex-direction:column; gap:16px; max-height:70vh; overflow-y:auto;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field-label-row{display:flex; align-items:center; justify-content:space-between;}
  .field label{font-size:12.5px; font-weight:700; color:var(--ink-soft);}
  .field input[type=text], .field input[type=url], .field input[type=date], .field textarea{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 12px;
    font-size:13.5px; color:var(--ink); font-family:var(--font-body); outline:0; width:100%;
  }
  .field input:focus, .field textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);}
  .field textarea{resize:vertical; min-height:64px; line-height:1.5;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .thumb-picker{display:flex; gap:14px; align-items:flex-start;}
  .thumb-focus-row{display:flex; gap:12px; align-items:center; margin-top:12px; padding-top:12px; border-top:1px solid var(--line-soft);}
  .thumb-square-preview{width:52px; height:52px; border-radius:8px; overflow:hidden; background:var(--surface-2); flex:none;}
  .thumb-square-preview img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb-square-preview.has-img{cursor:zoom-in;}
  .thumb-focus-row input[type=range]{width:100%; accent-color:var(--accent);}
  .thumb-preview{
    width:96px; aspect-ratio:9/16; border-radius:12px; background:var(--surface-2); border:1.5px dashed var(--line);
    flex:none; overflow:hidden; display:flex; align-items:center; justify-content:center; position:relative;
  }
  .thumb-preview img{width:100%; height:100%; object-fit:cover;}
  .thumb-preview.has-img{cursor:zoom-in;}
  .thumb-controls{display:flex; flex-direction:column; gap:8px; flex:1;}
  .upload-status{font-size:11.5px; color:var(--ink-faint);}
  .modal-foot{
    display:flex; align-items:center; justify-content:space-between; gap:10px; padding:16px 20px;
    border-top:1px solid var(--line); background:var(--surface);
  }
  .type-select-row{display:flex; gap:8px; flex-wrap:wrap;}
  .type-opt{
    border:1px solid var(--line); background:var(--paper); border-radius:var(--radius-pill); padding:7px 12px;
    font-size:12px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; color:var(--ink-soft);
  }
  .type-opt .dot{width:7px; height:7px; border-radius:50%;}
  .type-opt.active{border-color:currentColor; background:var(--surface-2); color:var(--ink);}
  .type-empty-hint{font-size:12px; color:var(--ink-faint);}
  .hint{font-size:11.5px; color:var(--ink-faint);}
  #uploadDoneHint{color:var(--status-done); font-weight:700;}

  /* ---- manage types modal ---- */
  .type-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line-soft);}
  .type-row:last-of-type{border-bottom:0;}
  .type-row .dot{width:11px; height:11px; border-radius:50%; flex:none;}
  .color-pick{position:relative; display:inline-block; overflow:hidden; border-radius:50%; cursor:pointer; flex:none;}
  .color-pick input[type=color]{position:absolute; inset:0; width:100%; height:100%; opacity:0; border:0; padding:0; margin:0; cursor:pointer; background:none;}
  .type-row .color-pick{width:22px; height:22px; border:1px solid var(--line);}
  .type-row input{
    flex:1; border:1px solid transparent; background:transparent; font-size:13.5px; color:var(--ink);
    font-family:var(--font-body); padding:6px 8px; border-radius:8px; outline:0;
  }
  .type-row input:focus{border-color:var(--line); background:var(--paper);}
  .type-del{
    border:0; background:transparent; color:var(--ink-faint); cursor:pointer; padding:6px 10px; border-radius:var(--radius-pill);
    font-size:11.5px; font-weight:700; display:flex; align-items:center; gap:5px; white-space:nowrap;
  }
  .type-del:hover{color:var(--status-late); background:var(--surface-2);}
  .type-del.confirming{color:var(--paper); background:var(--status-late);}
  .swatch-row{display:flex; gap:8px; flex-wrap:wrap;}
  .swatch{width:24px; height:24px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0;}
  .swatch.selected{border-color:var(--ink);}
  .swatch.swatch-custom-wrap{
    background:conic-gradient(from 0deg,#ff4d6d,#ffb020,#c9e34c,#2fbf71,#2f9fe4,#8a6bff,#ff4d6d);
  }
  .swatch.swatch-custom-wrap.selected{border-color:var(--ink);}
  .add-type-row{display:flex; flex-direction:column; gap:10px; margin-top:12px; padding-top:14px; border-top:1px solid var(--line);}
  .add-type-form{display:flex; gap:8px; align-items:center;}

  [hidden]{display:none !important;}

  @media (max-width:600px){
    .two-col{grid-template-columns:1fr;}
    .modal{max-width:100%;}
    .grid{grid-template-columns:repeat(auto-fill, minmax(148px,1fr)); gap:12px;}
    .month-cells{gap:5px;} .month-dow{gap:5px;}
    .day-cell{padding:4px; gap:3px;}
    .day-title{font-size:9.5px;}
  }

<script>
(function(){
  var SWATCHES = ['--tag-cyan','--tag-magenta','--tag-amber','--tag-violet','--tag-lime','--tag-rust','--tag-teal','--tag-slate'];
  var FALLBACK_TYPE = {id:null, label:'미분류', colorVar:'--ink-faint'};

  var db = null, assetsCap = null;
  var posts = [];
  var contentTypes = [];
  var dayMemos = {};
  var searchQuery = '';
  var activeFilters = new Set();
  var editingId = null;
  var pendingAsset = null;
  var uploadingNow = false;
  var viewMode = 'month';
  var cursorDate = new Date();
  var newTypeSwatch = SWATCHES[0];
  var newTypeCustomColor = null;

  function typeColor(t){ return t.color ? t.color : ('var('+(t.colorVar||'--ink-faint')+')'); }
  function resolveVarColor(varName){
    try { return getComputedStyle(document.documentElement).getPropertyValue(varName).trim() || '#888888'; }
    catch(e){ return '#888888'; }
  }

  var contentEl = document.getElementById('content');
  var bannerEl = document.getElementById('banner');
  var chipsEl = document.getElementById('filterChips');
  var overlay = document.getElementById('overlay');
  var typesOverlay = document.getElementById('typesOverlay');
  var rangeLabel = document.getElementById('rangeLabel');

  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function toISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function parseISO(s){ var p=s.split('-'); return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10)); }
  function addDays(d,n){ var r=new Date(d); r.setDate(r.getDate()+n); return r; }
  function mondayOf(dateStr){
    var d = parseISO(dateStr);
    var day = d.getDay();
    var diff = (day===0? -6 : 1-day);
    d.setDate(d.getDate()+diff);
    return toISO(d);
  }
  var WEEKDAYS = ['일','월','화','수','목','금','토'];
  function formatRange(mondayKey){
    var start = parseISO(mondayKey);
    var end = new Date(start); end.setDate(end.getDate()+6);
    var s = (start.getMonth()+1)+'.'+start.getDate()+'('+WEEKDAYS[start.getDay()]+')';
    var e = (end.getMonth()+1)+'.'+end.getDate()+'('+WEEKDAYS[end.getDay()]+')';
    return s+' – '+e;
  }
  var todayKey = toISO(new Date());
  var currentMonday = mondayOf(todayKey);

  function statusOf(post){
    if (post.uploadLink) return {label:'완료', v:'--status-done'};
    if (post.date >= todayKey) return {label:'예정', v:'--status-scheduled'};
    return {label:'지연', v:'--status-late'};
  }
  function esc(s){ var d = document.createElement('div'); d.textContent = s==null? '' : s; return d.innerHTML; }
  function typeInfo(id){
    for (var i=0;i<contentTypes.length;i++) if (contentTypes[i].id===id) return contentTypes[i];
    return FALLBACK_TYPE;
  }

  /* ---------- filter chips ---------- */
  function renderChips(){
    var html = '<button type="button" class="chip'+(activeFilters.size===0?' active':'')+'" data-key="__all">전체</button>';
    contentTypes.forEach(function(t){
      html += '<button type="button" class="chip'+(activeFilters.has(t.id)?' active':'')+'" data-key="'+t.id+'" style="color:'+typeColor(t)+'"><span class="dot"></span>'+esc(t.label)+'</button>';
    });
    chipsEl.innerHTML = html;
    Array.prototype.forEach.call(chipsEl.querySelectorAll('.chip'), function(btn){
      btn.addEventListener('click', function(){
        var k = btn.getAttribute('data-key');
        if (k==='__all'){ activeFilters.clear(); }
        else { activeFilters.has(k) ? activeFilters.delete(k) : activeFilters.add(k); }
        renderChips(); render();
      });
    });
  }

  function thumbSrc(post){
    if (post.thumbnailAssetId) return '/_blob/'+post.thumbnailAssetId;
    if (post.thumbnailUrl) return post.thumbnailUrl;
    return null;
  }
  function placeholderSvg(colorValue, size){
    size = size || 34;
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" style="color:'+colorValue+'; opacity:.55"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.6"/><path d="M10 8.5v7l6-3.5-6-3.5z" fill="currentColor"/></svg>';
  }

  function matchesFilters(post){
    if (activeFilters.size>0 && !activeFilters.has(post.contentType)) return false;
    if (searchQuery){
      var q = searchQuery.toLowerCase();
      var hay = ((post.title||'')+' '+(post.description||'')).toLowerCase();
      if (hay.indexOf(q)===-1) return false;
    }
    return true;
  }

  /* ---------- card (week view) ---------- */
  function cardHtml(post){
    var t = typeInfo(post.contentType);
    var st = statusOf(post);
    var src = thumbSrc(post);
    var d = parseISO(post.date);
    var dateLabel = (d.getMonth()+1)+'.'+d.getDate()+'('+WEEKDAYS[d.getDay()]+')';
    return (
      '<div class="card" data-id="'+post.id+'">'+
        '<div class="thumb">'+
          (src ? '<img src="'+esc(src)+'" alt="" loading="lazy">' : '<div class="thumb-ph" style="background:linear-gradient(160deg, color-mix(in srgb, '+typeColor(t)+' 18%, var(--surface-2)), var(--surface-2))">'+placeholderSvg(typeColor(t))+'</div>')+
          '<div class="type-badge"><span class="dot" style="background:'+typeColor(t)+'"></span><span>'+esc(t.label)+'</span></div>'+
          (post.isExample ? '<div class="example-tag">예시</div>' : '')+
          '<button type="button" class="del-btn" data-action="del" title="삭제"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2m-9 0l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>'+
        '</div>'+
        '<div class="card-body">'+
          '<div class="meta-row">'+
            '<span class="card-date">'+dateLabel+'</span>'+
            '<span class="status" style="color:var('+st.v+')"><span class="dot" style="background:var('+st.v+')"></span>'+st.label+'</span>'+
          '</div>'+
          '<p class="card-title">'+esc(post.title||'(제목 없음)')+'</p>'+
          '<p class="card-desc">'+esc(post.description||'')+'</p>'+
          '<div class="card-foot">'+ linkChip(post.uploadLink,'업로드') + linkChip(post.driveLink,'드라이브') +'</div>'+
        '</div>'+
      '</div>'
    );
  }
  function linkChip(url, label){
    if (!url) return '<span class="link-chip empty">'+label+' 없음</span>';
    return '<a class="link-chip live" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer" data-stop="1">'+label+'</a>';
  }
  function wireCardEvents(root){
    Array.prototype.forEach.call(root.querySelectorAll('.card'), function(card){
      var id = card.getAttribute('data-id');
      card.addEventListener('click', function(e){
        if (e.target.closest('[data-stop]')) return;
        if (e.target.closest('[data-action="del"]')) return;
        var post = posts.filter(function(p){return p.id===id;})[0];
        if (post) openModal(post);
      });
      var delBtn = card.querySelector('[data-action="del"]');
      delBtn.addEventListener('click', function(e){
        e.stopPropagation();
        if (delBtn.classList.contains('confirming')){ performDelete(id); }
        else {
          delBtn.classList.add('confirming');
          delBtn.innerHTML = '삭제 확인';
          setTimeout(function(){
            delBtn.classList.remove('confirming');
            delBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2m-9 0l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
          }, 2600);
        }
      });
    });
  }
  function performDelete(id){ if (db) db.collection('posts').doc(id).delete().catch(function(){}); }

  /* ---------- month view ---------- */
  function buildMonthDates(year, month){
    var first = new Date(year, month, 1);
    var startOffset = (first.getDay()+6)%7;
    var gridStart = new Date(year, month, 1-startOffset);
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var rows = Math.ceil((startOffset+daysInMonth)/7);
    var cells = [];
    for (var i=0;i<rows*7;i++){ var d=new Date(gridStart); d.setDate(gridStart.getDate()+i); cells.push(d); }
    return cells;
  }
  function renderMonth(filtered){
    var year = cursorDate.getFullYear(), month = cursorDate.getMonth();
    var byDate = {};
    filtered.forEach(function(p){ (byDate[p.date] = byDate[p.date] || []).push(p); });
    var cells = buildMonthDates(year, month);
    var dowHtml = '<div class="month-dow">'+ ['월','화','수','목','금','토','일'].map(function(w){return '<span>'+w+'</span>';}).join('') +'</div>';
    var cellsHtml = cells.map(function(d){
      var iso = toISO(d);
      var isOutside = d.getMonth()!==month;
      var isToday = iso===todayKey;
      var items = (byDate[iso]||[]).slice().sort(function(a,b){ return (a.createdAt||'')<(b.createdAt||'')?-1:1; });
      var primary = items[0];
      var visibleCount = Math.min(4, items.length);
      var visibleItems = items.slice(0, visibleCount);
      var extraCount = items.length - visibleCount;
      var thumbInner, thumbEmptyClass = '';
      if (visibleItems.length===0){
        thumbEmptyClass = ' empty';
        thumbInner = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
      } else {
        thumbInner = visibleItems.map(function(p, idx){
          var t = typeInfo(p.contentType);
          var src = thumbSrc(p);
          var span = '';
          if (visibleCount===1) span = 'grid-column:span 2; grid-row:span 2;';
          else if (visibleCount===2) span = 'grid-row:span 2;';
          else if (visibleCount===3 && idx===0) span = 'grid-column:span 2;';
          var media = src
            ? '<img src="'+esc(src)+'" alt="" style="object-position:center '+(p.thumbFocusY!=null?p.thumbFocusY:50)+'%">'
            : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg, color-mix(in srgb, '+typeColor(t)+' 18%, var(--surface-2)), var(--surface-2))">'+placeholderSvg(typeColor(t), visibleCount===1?40:18)+'</div>';
          var viewTab = p.uploadLink ? '<span class="view-tab" data-view-link="'+esc(p.uploadLink)+'">보러가기</span>' : '';
          var editTab = p.driveLink ? '<span class="edit-tab" data-view-link="'+esc(p.driveLink)+'">편집 완료</span>' : '';
          return '<div class="day-thumb-tile" data-id="'+p.id+'" style="'+span+'">'+media+viewTab+editTab+'</div>';
        }).join('');
      }
      var titleHtml = primary ? esc(primary.title||'(제목 없음)') : '';
      var moreHtml = extraCount>0 ? ('+'+extraCount+'개 더') : '';
      var memoHtml = dayMemos[iso] ? '<span class="day-memo" title="'+esc(dayMemos[iso])+'">'+esc(dayMemos[iso])+'</span>' : '';
      return '<div class="day-cell'+(isOutside?' outside':'')+(isToday?' today':'')+'" data-date="'+iso+'">'+
        '<div class="day-num">'+(isToday?'<span class="today-badge">'+d.getDate()+'</span>':d.getDate())+memoHtml+'</div>'+
        '<div class="day-slot" data-id="'+(primary?primary.id:'')+'">'+
          '<div class="day-thumb'+thumbEmptyClass+'">'+thumbInner+'</div>'+
          '<div class="day-title">'+titleHtml+'</div>'+
        '</div>'+
        '<div class="day-more" data-more="'+(extraCount>0?iso:'')+'">'+moreHtml+'</div>'+
      '</div>';
    }).join('');
    return '<div class="month-wrap">'+dowHtml+'<div class="month-cells">'+cellsHtml+'</div></div>';
  }
  function wireMonthEvents(root){
    Array.prototype.forEach.call(root.querySelectorAll('.day-cell'), function(cell){
      var iso = cell.getAttribute('data-date');
      cell.addEventListener('click', function(e){
        var more = e.target.closest('.day-more');
        if (more && more.getAttribute('data-more')){
          viewMode = 'week'; cursorDate = parseISO(more.getAttribute('data-more'));
          Array.prototype.forEach.call(document.querySelectorAll('.seg-btn'), function(b){ b.classList.toggle('active', b.getAttribute('data-mode')==='week'); });
          render(); return;
        }
        var linkTab = e.target.closest('.view-tab, .edit-tab');
        if (linkTab){
          var link = linkTab.getAttribute('data-view-link');
          if (link) window.open(link, '_blank', 'noopener,noreferrer');
          return;
        }
        var numEl = e.target.closest('.day-num');
        if (numEl){ openDayMemoModal(iso); return; }
        var tile = e.target.closest('.day-thumb-tile');
        var slot = e.target.closest('.day-slot');
        var id = tile ? tile.getAttribute('data-id') : (slot ? slot.getAttribute('data-id') : '');
        if (id){
          var post = posts.filter(function(p){return p.id===id;})[0];
          if (post) openModal(post);
          return;
        }
        openModal(null, iso);
      });
    });
  }

  /* ---------- week view ---------- */
  function renderWeek(filtered){
    var wk = mondayOf(toISO(cursorDate));
    var items = filtered.filter(function(p){ return mondayOf(p.date)===wk; }).sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; });
    var totalCount = items.length;
    var postedCount = items.filter(function(p){ return !!p.uploadLink; }).length;
    var pct = totalCount>0 ? Math.min(100, Math.round((postedCount/totalCount)*100)) : 0;
    var body = items.length
      ? '<div class="grid">'+ items.map(cardHtml).join('') +'</div>'
      : '<div class="empty"><h2>이 주에는 등록된 콘텐츠가 없어요</h2><p>아래 버튼으로 이번 주 콘텐츠를 추가해보세요.</p><button class="btn btn-primary" id="weekAddBtn" type="button">+ 콘텐츠 추가</button></div>';
    return '<div class="week" id="week-'+wk+'">'+
      '<div class="week-head">'+
        '<div class="week-title-row"><span class="week-range">'+formatRange(wk)+'</span>'+(wk===currentMonday?'<span class="pill-now">이번 주</span>':'')+'</div>'+
        '<div class="week-progress"><div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div><span class="progress-label">'+postedCount+' / '+totalCount+' 업로드</span></div>'+
      '</div>'+ body +
    '</div>';
  }

  /* ---------- master render ---------- */
  function equalizeDayCellHeights(){
    var cells = contentEl.querySelectorAll('.day-cell');
    if (!cells.length) return;
    Array.prototype.forEach.call(cells, function(c){ c.style.height = 'auto'; });
    var max = 0;
    Array.prototype.forEach.call(cells, function(c){ max = Math.max(max, c.offsetHeight); });
    Array.prototype.forEach.call(cells, function(c){ c.style.height = max + 'px'; });
  }
  var resizeTimer = null;
  window.addEventListener('resize', function(){
    if (viewMode!=='month') return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(equalizeDayCellHeights, 150);
  });

  function render(){
    if (viewMode==='month'){
      rangeLabel.textContent = cursorDate.getFullYear()+'년 '+(cursorDate.getMonth()+1)+'월';
    } else {
      rangeLabel.textContent = formatRange(mondayOf(toISO(cursorDate)));
    }
    var filtered = posts.filter(matchesFilters);
    if (posts.length===0){
      contentEl.innerHTML =
        '<div class="empty">'+
          '<h2>아직 등록된 콘텐츠가 없어요</h2>'+
          '<p>업로드 예정 콘텐츠부터 추가해보세요. 썸네일, 업로드 링크, 드라이브 링크까지 한 번에 정리할 수 있어요.</p>'+
          '<button class="btn btn-primary" id="emptyAddBtn" type="button">+ 첫 콘텐츠 추가</button>'+
        '</div>';
      var eb = document.getElementById('emptyAddBtn');
      if (eb) eb.addEventListener('click', function(){ openModal(); });
      return;
    }
    if (filtered.length===0 && searchQuery){
      contentEl.innerHTML = '<div class="empty"><h2>검색 결과가 없어요</h2><p>다른 검색어나 필터를 시도해보세요.</p></div>';
      return;
    }
    if (viewMode==='month'){
      contentEl.innerHTML = renderMonth(filtered);
      wireMonthEvents(contentEl);
      equalizeDayCellHeights();
      var imgs = contentEl.querySelectorAll('.day-thumb-tile img');
      Array.prototype.forEach.call(imgs, function(img){
        if (!img.complete) img.addEventListener('load', equalizeDayCellHeights);
      });

  function saveDayMemo(){
    if (!db || !editingMemoDate) return;
    var text = fDayMemo.value.trim();
    var ref = db.collection('dayMemos').doc(editingMemoDate);
    (text ? ref.set({text: text, updatedAt: new Date().toISOString()}) : ref.delete()).catch(function(){});

  memoOverlay.addEventListener('click', function(e){ if (e.target===memoOverlay) closeDayMemoModal(); });

  function openModal(post, prefillDate){
    editingId = post ? post.id : null;
    pendingAsset = null; uploadingNow = false;
    modalTitle.textContent = post ? '콘텐츠 수정' : '새 콘텐츠 추가';
    deleteBtn.hidden = !post;
    deleteBtn.textContent = '이 콘텐츠 삭제';
    deleteBtn.style.color = '';
    fDate.value = post ? post.date : (prefillDate || todayKey);
    selectedType = post ? post.contentType : (contentTypes[0] ? contentTypes[0].id : null);
    renderTypeRow();
    fTitle.value = post ? (post.title||'') : '';
    fDesc.value = post ? (post.description||'') : '';
    fThumbUrl.value = post ? (post.thumbnailUrl||'') : '';
    fUploadLink.value = post ? (post.uploadLink||'') : '';
    uploadDoneHint.hidden = !fUploadLink.value.trim();
    fDriveLink.value = post ? (post.driveLink||'') : '';
    fThumbFile.value = '';
    fThumbFocus.value = post && post.thumbFocusY!=null ? post.thumbFocusY : 50;
    uploadStatus.textContent = '';
    var src = post ? thumbSrc(post) : null;
    currentEditThumbSrc = src;
    thumbPreview.innerHTML = src ? '<img src="'+esc(src)+'" alt="">' : THUMB_PH;
    markHasImg(thumbPreview);
    fThumbFile.hidden = !assetsCap;
    fThumbFile.parentElement && (uploadStatus.hidden = !assetsCap);
    refreshThumbFocusUI();
    overlay.hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeModal(){ overlay.hidden = true; document.body.style.overflow = ''; }

  fThumbFile.addEventListener('change', function(){
    var file = fThumbFile.files && fThumbFile.files[0];
    if (!file || !assetsCap) return;
    uploadingNow = true; uploadStatus.textContent = '업로드 중...';
    assetsCap.upload(file).then(function(res){
      pendingAsset = res; uploadStatus.textContent = '업로드 완료';
      thumbPreview.innerHTML = '<img src="'+esc(res.url)+'" alt="">';
      markHasImg(thumbPreview);
      uploadingNow = false;
      refreshThumbFocusUI();
    }).catch(function(){ uploadStatus.textContent = '업로드 실패: 다시 시도해주세요'; uploadingNow = false; });
  });
  fThumbUrl.addEventListener('input', function(){
    if (!pendingAsset){ thumbPreview.innerHTML = fThumbUrl.value.trim() ? '<img src="'+esc(fThumbUrl.value.trim())+'" alt="">' : THUMB_PH; markHasImg(thumbPreview); }
    refreshThumbFocusUI();
  });
  fThumbFocus.addEventListener('input', refreshThumbFocusUI);
  fUploadLink.addEventListener('input', function(){ uploadDoneHint.hidden = !fUploadLink.value.trim(); });

  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', function(e){ if (e.target===overlay) closeModal(); });
  document.addEventListener('keydown', function(e){
    if (e.key==='Escape'){ if (!lightboxOverlay.hidden) closeLightbox(); else if (!memoOverlay.hidden) closeDayMemoModal(); else if (!overlay.hidden) closeModal(); if (!typesOverlay.hidden) closeTypesModal(); }
  });

  document.getElementById('saveBtn').addEventListener('click', function(){
    if (!db) return;
    if (uploadingNow){ uploadStatus.textContent = '이미지 업로드가 끝난 뒤 저장해주세요'; return; }
    var title = fTitle.value.trim();
    if (!fDate.value){ fDate.focus(); return; }
    if (!selectedType){ uploadStatus.textContent = '콘텐츠 종류를 먼저 추가해주세요'; return; }
    var payload = {
      date: fDate.value,
      contentType: selectedType,
      title: title,
      description: fDesc.value.trim(),
      thumbnailUrl: fThumbUrl.value.trim(),
      thumbFocusY: parseInt(fThumbFocus.value, 10) || 50,
      uploadLink: fUploadLink.value.trim(),
      driveLink: fDriveLink.value.trim()
    };
    if (pendingAsset) payload.thumbnailAssetId = pendingAsset.id;
    var saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true;
    var op = editingId
      ? db.collection('posts').doc(editingId).update(payload)
      : (payload.createdAt = new Date().toISOString(), db.collection('posts').add(payload));
    op.then(function(){ saveBtn.disabled = false; closeModal(); })
      .catch(function(){ saveBtn.disabled = false; uploadStatus.textContent = '저장에 실패했어요. 다시 시도해주세요.'; });

  function renderTypeList(){
    if (contentTypes.length===0){
      typeListWrap.innerHTML = '<p class="type-empty-hint">아직 등록된 콘텐츠 종류가 없어요. 아래에서 추가해보세요.</p>';
      return;
    }
    typeListWrap.innerHTML = contentTypes.map(function(t){
      var colorVal = t.color || resolveVarColor(t.colorVar||'--ink-faint');
      return '<div class="type-row" data-id="'+t.id+'">'+
        '<span class="color-pick" style="background:'+colorVal+'" title="색상 변경"><input type="color" class="type-color-input" data-id="'+t.id+'" value="'+colorVal+'"></span>'+
        '<input type="text" value="'+esc(t.label)+'" data-id="'+t.id+'">'+
        '<button type="button" class="type-del" data-id="'+t.id+'">삭제</button>'+
      '</div>';
    }).join('');
    Array.prototype.forEach.call(typeListWrap.querySelectorAll('input[type=text]'), function(inp){
      var id = inp.getAttribute('data-id');
      function commit(){
        var val = inp.value.trim();
        if (!val || !db) return;
        var current = typeInfo(id);
        if (val===current.label) return;
        db.collection('contentTypes').doc(id).update({label: val}).catch(function(){});
      }
      inp.addEventListener('blur', commit);
      inp.addEventListener('keydown', function(e){ if (e.key==='Enter'){ inp.blur(); } });
    });
    Array.prototype.forEach.call(typeListWrap.querySelectorAll('.type-color-input'), function(inp){
      var id = inp.getAttribute('data-id');
      var proxy = inp.parentElement;
      inp.addEventListener('input', function(){ proxy.style.background = inp.value; });
      inp.addEventListener('change', function(){
        if (!db) return;
        db.collection('contentTypes').doc(id).update({color: inp.value, colorVar: null}).catch(function(){});
      });
    });
    Array.prototype.forEach.call(typeListWrap.querySelectorAll('.type-del'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-id');
        if (btn.classList.contains('confirming')){
          if (db) db.collection('contentTypes').doc(id).delete().catch(function(){});
        } else {
          btn.classList.add('confirming'); btn.textContent = '삭제 확인';
          setTimeout(function(){ btn.classList.remove('confirming'); btn.textContent = '삭제'; }, 2600);
        }
      });
    });
  }

  /* ---------- capability wiring ---------- */
  if (window.claude && window.claude.use){
    Promise.all([window.claude.use('db'), window.claude.use('assets')]).then(function(res){
      db = res[0]; assetsCap = res[1];
      if (!db){
        bannerEl.innerHTML = '<div class="banner">이 화면에서는 데이터베이스에 연결할 수 없어요. 콘텐츠를 추가하거나 수정하려면 원본 아티팩트 링크로 열어주세요.</div>';
        return;
      }
      db.collection('contentTypes').orderBy('createdAt','asc').onSnapshot(function(snap){
        contentTypes = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        renderChips(); renderTypeRow(); if (!typesOverlay.hidden) renderTypeList(); render();
      });
      db.collection('dayMemos').onSnapshot(function(snap){
        dayMemos = {};
        snap.docs.forEach(function(d){ dayMemos[d.id] = (d.data()||{}).text; });
        render();
      });
      db.collection('posts').orderBy('date','asc').onSnapshot(function(snap){
        posts = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        render();
        var hasExample = posts.some(function(p){ return p.isExample; });
        bannerEl.innerHTML = hasExample
          ? '<div class="banner"><span>예시로 채워진 콘텐츠가 있어요. 실제 콘텐츠를 추가한 뒤 예시 카드는 삭제해주세요.</span></div>'
          : '';
      }, function(err){
        bannerEl.innerHTML = '<div class="banner">데이터를 불러오지 못했어요 ('+esc(err.code||'')+'). 새로고침해보세요.</div>';
      });
    });
  } else {
    bannerEl.innerHTML = '<div class="banner">이 미리보기에서는 저장 기능을 사용할 수 없어요. 발행된 아티팩트 링크에서 열어주세요.</div>';
  }
})();
</script>
